  /* ---- Keyboard (Command works wherever Ctrl does, for Mac users) ---- */
  function normKey(e) {
    const k = e.key;
    if (k === ' ' || k === 'Spacebar') return 'Space';
    if (k === 'Esc') return 'Escape';
    if (k === 'Del') return 'Delete';
    if (e.code === 'NumpadDecimal' && (k === ',' || k === '.' || k === 'Decimal')) return '.';
    if (k && k.length === 1) return k.toLowerCase();
    return k || '';
  }
  function initKeys() {
    document.addEventListener('keydown', (e) => {
      const k = normKey(e), ctrl = e.ctrlKey || e.metaKey;
      if (ctrl && (k === 's' || k === 'o')) {
        e.preventDefault();
        if (modalStack.length || eng.mode === 'textedit' || eng.mode === 'walledit') return;
        if (k === 'o') Host.openProject(); else if (e.shiftKey) Host.saveProjectAs(); else Host.saveProject();
        return;
      }
      if (modalStack.length) return;
      const ae = document.activeElement;
      if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT' || ae.isContentEditable)) return;
      if (ae && ae !== wrap && ae !== document.body && ae !== svg) return;
      if (k === 'Tab' || k === 'Shift' || k === 'Control' || k === 'Alt' || k === 'Meta') return;
      if (ae !== wrap) wrap.focus({ preventScroll: true });
      const handled = eng.key(k, { shift: e.shiftKey, ctrl, alt: e.altKey, repeat: e.repeat });
      if (handled || k.startsWith('Arrow') || k === 'Space' || k === 'F4' || k === 'Backspace') e.preventDefault();
    });
    window.addEventListener('keydown', (e) => { if (e.key === 'F4') e.preventDefault(); }, true);
    // Alt is used for Alt+drag panning: keep the browser from moving focus to its menu.
    const altGuard = (e) => { if (e.key === 'Alt' && !modalStack.length) e.preventDefault(); };
    window.addEventListener('keydown', altGuard, true); window.addEventListener('keyup', altGuard, true);
  }

  /* ---- Final Check dialog (clickable items) and showing an area on screen ---- */
  function focusArea(areaId) {
    const a = eng.area(areaId); if (!a || !a.corners.length) return;
    const xs = a.corners.map(c => c.x + a.layoutOffset.x), ys = a.corners.map(c => c.y + a.layoutOffset.y);
    const x1 = Math.min(...xs), x2 = Math.max(...xs), y1 = Math.min(...ys), y2 = Math.max(...ys);
    const { W, H } = Render.viewSize(svg);
    // Keep the current zoom when the area fits; zoom out if it does not; zoom in if it is tiny.
    const fit = Math.min(W * 0.6 / Math.max(x2 - x1, 1), H * 0.6 / Math.max(y2 - y1, 1));
    setScale(Math.min(Math.max(ui.view.s, fit * 0.5), fit));
    ui.view.ox = (x1 + x2) / 2 - W / 2 / ui.view.s; ui.view.oy = (y1 + y2) / 2 - H / 2 / ui.view.s;
    if (eng.mode === 'select') { eng.selection = [{ t: 'area', id: a.id }]; eng.activeGroupId = a.groupId; }
    eng.changed(); schedule();
  }

  /* ---- Recovery copies in browser storage (a convenience, not a backup) ---- */
  const Recovery = {
    key: (pid) => REC + pid,
    write(storage, doc, session, meta) {
      try {
        const k = REC + doc.projectId, prevText = storage.getItem(k);

            if (p && p.windowId !== meta.windowId && p.time > Math.max(meta.lastWrite || 0, meta.openedAt || 0))
              return { ok: false, conflict: true, message: 'Another window has newer recovery data for this project; it was not overwritten' };
          } catch (e) { /* corrupt record: replace it */ }
        }
        const rec = { time: Date.now(), windowId: meta.windowId, dirty: !!meta.dirty, name: doc.name, projectId: doc.projectId, data: serialize(doc, session) };
        storage.setItem(k, JSON.stringify(rec));

    },
    findNewest(storage) {

    if (r.ok) { state.lastWrite = r.time; UI.setRecoveryInfo('Recovery copy ' + new Date(r.time).toLocaleTimeString()); }

  function noteChange() {

  function checkRecovery() {

    const found = Recovery.findNewest(st);
    if (!found || !found.rec) { if (found && found.corrupt) UI.setRecoveryInfo('A damaged recovery record was ignored'); return; }
    const when = new Date(found.rec.time).toLocaleString();
    UI.openModal({ title: 'Recover unsaved work?', body: UI.h('div', { style: 'max-width:480px' },
      UI.h('p', { text: 'This browser has a recovery copy of "' + String(found.rec.name).slice(0, 100) + '" from ' + when + ', with changes that were not saved to a project file.' }),
      UI.h('p', { class: 'small muted', text: 'Recovery copies are a convenience only. Save a project file to keep your work.' })),
      buttons: [{ label: 'Not now', cancel: true },
        { label: 'Delete recovery copy', onClick: () => { Recovery.remove(st, found.key); } },
        { label: 'Restore', primary: true, onClick: () => {
          const r = parse(found.rec.data);
          if (!r.ok) { UI.alertBox('Recovery failed', 'The recovery copy could not be read: ' + r.error, 'err'); return; }
          UI.loadDocument(r.doc, r.session, 'Recovered copy from ' + when + ' (save it to a file)');
          UI.eng.dirty = true; UI.eng.say('Recovered work from ' + when + '. Save it to a project file.', 'ok'); UI.eng.changed();

  /* ---- Save / open ---- */
  function download(blob, name) {

  async function writeHandle(handle, text) {

      if (p !== 'granted') { const e = new Error('permission to write the file was not granted'); e.name = 'NotAllowedError'; throw e; }

  async function saveText(text, name, asNew, deps, st) {
    try {
      if (!asNew && st.handle && typeof st.handle.createWritable === 'function') {
        await writeHandle(st.handle, text);
        return { ok: true, method: 'file', name: st.handle.name || name };
      }
      if (deps.picker) {
        let handle = null;
        try { handle = await deps.picker({ suggestedName: name, types: [{ description: APP + ' project', accept: { 'application/json': ['.json'] } }] }); }
        catch (e) { if (e && e.name === 'AbortError') return { ok: false, cancelled: true, message: 'Save cancelled. Nothing was saved.' }; handle = null; }
        if (handle) { await writeHandle(handle, text); st.handle = handle; return { ok: true, method: 'file', name: handle.name || name }; }
      }

  async function readAndLoad(file, handle, askFirst) {

  /* ---- Image export ---- */

      const f = Model.EXPORT_FORMATS[opts.format] || Model.EXPORT_FORMATS[Model.DEFAULT_SETTINGS.exportFormat];

      const name = safeName(doc.name) + f.extension;

  async function run(userStateFn) {
    const t0 = performance.now(), user0 = userStateFn ? userStateFn() : null, results = [];
    for (const t of tests) {
      if (t.id === 59) continue;
      results.push(await runOne(t, { user0, userStateFn }));
    }
    results.push(await runOne(tests.find(t => t.id === 59), { user0, userStateFn }));
    return { results, ms: Math.round(performance.now() - t0) };
  }
  async function runOne(t, ctx) {
    const c = new Check();
    try { await t.fn(c, ctx); } catch (err) { c.fail('exception', String(err && err.stack ? err.stack : err).slice(0, 600)); }
    return { id: t.id, name: t.name, pass: c.ok && c.lines.length > 0, details: c.lines.join('\n') };
  }
  // The Sample House for "Load Example", drawn through the command engine the way a person would.
  function buildExample() {
    const e = fresh(); e.doc.name = 'Sample House'; e.doc.palette = Files.loadPalette();
    house(e); garage(e);
    e.key('Space');   // hide the garage's closing dimension: that wall sits on the house wall
    e.addLabel({ x: 10, y: -7 }, 'Living Room', 'room');
    e.addLabel({ x: 39, y: -31 }, 'Kitchen', 'room');
    e.addLabel({ x: 10, y: -25 }, 'Bedroom', 'room');
    e.addSymbol({ x: 9, y: -1.5 }, 'door');           // front door, snapped onto the front wall
    e.addSymbol({ x: 1.5, y: -6 }, 'door');           // door between the garage and the house
    e.selection = [];
    e.doc.settings = Object.assign({}, Model.DEFAULT_SETTINGS);
    return e.doc;
  }
  return { run, buildExample, tests, keys, fresh, begin };
