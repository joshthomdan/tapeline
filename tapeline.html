  See "How to customize this with AI" in README.md. In short: keep a copy of the

<script>
/* Safety net: if the program cannot start (usually because of a mistake in a recent
   change to this file), show a plain message instead of a blank page. */
window.__appStarted = false;
window.addEventListener('error', function (ev) {
  if (window.__appStarted) return;
  var msg = (ev && (ev.message || (ev.error && ev.error.message))) || 'Unknown problem';
  var show = function () {
    if (document.getElementById('startupProblem')) return;
    var box = document.createElement('div');
    box.id = 'startupProblem';
    box.setAttribute('style', 'position:fixed;left:20px;right:20px;top:20px;z-index:999;background:#fff4f4;border:2px solid #b91c1c;' +
      'border-radius:6px;padding:14px 16px;font:14px Arial,sans-serif;color:#1c1f24;box-shadow:0 6px 24px rgba(0,0,0,.2)');
    var h = document.createElement('div'); h.textContent = 'The program could not start.';
    h.setAttribute('style', 'font-weight:bold;font-size:16px;color:#b91c1c;margin-bottom:6px');
    var p = document.createElement('div');
    p.textContent = 'If this file was changed recently, the change most likely has a mistake in it. Go back to the last copy that worked, ' +
      'or give this message to the AI that made the change and ask it to fix the problem. Details: ' + msg;
    box.appendChild(h); box.appendChild(p); document.body.appendChild(box);
  };
  if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
});
</script>
<script>
/* =============================================================================
   PART A.  SETTINGS YOU CAN CHANGE
   -----------------------------------------------------------------------------
   Everything most people want to change is in this one block: the program's
   name, colors, the room label list, area categories, levels, default settings
   and the stairs and door symbols.

   Rules that keep it working:
   - Text goes inside quote marks: 'Like this'. Keep the commas between items.
   - After any change, open the file and click Run Self-Tests on the toolbar.
     Every test should say PASS.
   - Lists you edit INSIDE the program (room labels, categories) are remembered
     by your browser. If you change a list here, the new list is used the next
     time the program opens.
   ============================================================================= */
const CONFIG = {

  /* ---- Name and credits (shown on the toolbar, in About and in saved files) ---- */
  appName: 'Tapeline',
  tagline: 'Free floor plan sketching for appraisers',
  version: '3.0.0',
  author: 'Joshua Daniel',
  year: '2026',
  // The web address of the project page, shown in the About box. Leave '' for none.
  projectLink: 'https://github.com/joshthomdan/tapeline',

  /* ---- Colors. Any web color works: '#1F3864', 'black', 'rgb(30, 60, 100)'. ---- */
  colors: {
    sketch: '#1F3864',      // walls, dimensions, area names and square footage (screen and exported image)
    roomLabels: '#000000',  // room labels and free text
    symbols: '#222222',     // stairs, doors and other symbols
    background: '#ffffff',  // page and exported image background
    accent: '#1F3864',      // toolbar title, highlighted buttons and dialog headings
    pen: '#16a34a',         // screen only: the wall being drawn and the pen position
    penUp: '#8a8f98',       // screen only: crosshair before the pen goes down
    snap: '#e07b00',        // screen only: snap markers, line-up guides and open ends
    selection: '#7fb2f0',   // screen only: highlight around selected items
    invalid: '#b91c1c',     // screen only: an area whose walls have a problem
  },
  // Lettering used on the sketch. List several; the first one the computer has is used.
  font: 'Arial, Helvetica, sans-serif',

  /* ---- Room labels: the list under "Room Labels" in the side panel ----
     Add, remove or reorder names. Each must be 100 characters or fewer. */
  roomLabels: ['Living Room', 'Family Room', 'Kitchen', 'Dining', 'Bedroom', 'Primary Bedroom',
    'Bath', 'Half Bath', 'Laundry', 'Office', 'Entry', 'Closet', 'Storage'],

  /* ---- Area categories: what an outline is (asked when you start or close an area) ----
     id ............ a short code, letters, numbers and dashes only, never shown. Give a
                     new category a new id and do not change the id of one people have
                     already used in saved sketches.
     name .......... what people see
     living ........ 'yes' = counts in the Living Area Total
                     'no' = gets its own separate total (for example Garage)
                     'separate' = its own separate total, for a separate living unit
     defaultLevel .. the level picked for it at first (must be one of the levels below) */
  areaCategories: [
    { id: 'cat-first',  name: 'First Floor',         living: 'yes',      defaultLevel: '1' },
    { id: 'cat-second', name: 'Second Floor',        living: 'yes',      defaultLevel: '2' },
    { id: 'cat-third',  name: 'Third Floor',         living: 'yes',      defaultLevel: '3' },
    { id: 'cat-bgl',    name: 'Below Grade Living',  living: 'yes',      defaultLevel: 'Lower' },
    { id: 'cat-garage', name: 'Garage',              living: 'no',       defaultLevel: '1' },
    { id: 'cat-ubsmt',  name: 'Unfinished Basement', living: 'no',       defaultLevel: 'Lower' },
    { id: 'cat-guest',  name: 'Guest Unit',          living: 'separate', defaultLevel: '1' },
    { id: 'cat-adu',    name: 'ADU',                 living: 'separate', defaultLevel: '1' },
    { id: 'cat-other',  name: 'Other',               living: 'no',       defaultLevel: '1' },
  ],

  /* ---- Levels offered in the Level lists. Areas are only compared with (and
     subtracted from) other areas on the same level. Shown as "Level 1", "Lower". ---- */
  levels: ['Lower', '1', '2', '3', '4'],

  /* ---- Starting settings for a new project (people can change them in Settings) ---- */
  defaultSettings: {
    enterMode: 'quick',       // 'quick' = one Enter per wall; 'classic' = two Enters (dimension step)
    containHandling: 'ask',   // area inside another area: 'ask', 'always' subtract, or 'never' subtract
    angleSnap: true,          // mouse walls snap to straight across / straight up and down
    textSize: 1.4,            // height of dimension and label lettering, in feet (0.3 to 10)
    grid: false,              // faint grid on screen
    shading: false,           // faint shading inside closed areas on screen
    exportLongSide: 3000,     // exported image size: pixels along its longer side (400 to 10000)
    exportFormat: 'png',      // which entry of exportFormats (below) is picked first
  },

  /* ---- Image formats offered by Export Image. They must be formats a browser can
     draw an image into: PNG, JPEG or WEBP. ---- */
  exportFormats: {
    png:  { label: 'PNG (recommended)', mimeType: 'image/png',  extension: '.png' },
    jpeg: { label: 'JPEG',              mimeType: 'image/jpeg', extension: '.jpg' },
  },

  // How many steps Undo can go back.
  undoSteps: 250,

  // Show the short disclaimer the first time the program is opened in a browser.
  showDisclaimerOnFirstRun: true,

  /* ---- Symbols: the buttons under "Symbols" in the side panel ----
     Symbols are drawings only. They never change walls or square footage.
     Each symbol has:
       name ........... what people see
       width, length .. starting size in feet
       keepSquare ..... true = width and length always stay equal
       snapToWall ..... true = it jumps onto the nearest wall when placed or dragged
                        (like the door), with the bottom edge of its box on the wall
       showInPalette .. false = hide its button (it still opens in saved sketches)
       draw(k, w, h) .. draws it. The symbol's box is w feet wide and h feet long,
                        centered on 0,0: the left edge is at x = -w/2, the right
                        edge at x = w/2, the top at y = -h/2 and the bottom at y = h/2
                        (y grows DOWNWARD). Build lines with the drawing kit k:
           k.line(x1, y1, x2, y2) ........... a straight line
           k.box(x1, y1, x2, y2) ............ a rectangle from one corner to the other
           k.poly([[x, y], ...], closed) .... lines through points (closed = back to start)
           k.arc(x1, y1, x2, y2, radius) .... a curve from one point to another
           k.circle(x, y, radius) ........... a circle
           k.arrowHead(x, y, dx, dy, size) .. an arrow tip at x, y pointing along dx, dy
           k.stroke(lines) .................. draws them (join pieces with +)
           k.tread .......................... standard stair tread depth (0.85 ft)
     The four symbols below are used by the self-tests: rename them freely, but keep
     their codes ('stairs-straight', 'stairs-l', 'stairs-u', 'door'). To add a symbol,
     copy one of them, give it a new code and change its drawing. */
  symbols: {
    'stairs-straight': {
      name: 'Stairs (straight)', width: 3.5, length: 10,
      draw(k, w, h) {
        const n = Math.max(3, Math.round(h / k.tread));                 // number of treads
        let d = k.box(-w / 2, -h / 2, w / 2, h / 2);                      // outline
        for (let i = 1; i < n; i++) { const y = -h / 2 + i * h / n; d += k.line(-w / 2, y, w / 2, y); }
        k.stroke(d);
        const top = -h / 2 + h / (2 * n);                                 // arrow pointing up the stairs
        k.stroke(k.line(0, h / 2 - h / (2 * n), 0, top) + k.arrowHead(0, top, 0, -1, Math.min(w, h) * 0.18));
      },
    },
    'stairs-l': {
      name: 'Stairs (L-shaped)', width: 7, length: 7,
      draw(k, w, h) {
        const sw = Math.min(w, h) * 0.45, x0 = -w / 2, y0 = -h / 2, L1 = h - sw, L2 = w - sw;   // sw = stair width
        const n1 = Math.max(2, Math.round(L1 / k.tread)), n2 = Math.max(2, Math.round(L2 / k.tread));
        let d = k.poly([[x0, h / 2], [x0, y0], [w / 2, y0], [w / 2, y0 + sw], [x0 + sw, y0 + sw], [x0 + sw, h / 2]], true);
        d += k.line(x0, y0 + sw, x0 + sw, y0 + sw) + k.line(x0 + sw, y0, x0 + sw, y0 + sw);       // landing
        for (let i = 1; i < n1; i++) { const y = y0 + sw + i * L1 / n1; d += k.line(x0, y, x0 + sw, y); }
        for (let i = 1; i < n2; i++) { const x = x0 + sw + i * L2 / n2; d += k.line(x, y0, x, y0 + sw); }
        k.stroke(d);
        const cx = x0 + sw / 2, cy = y0 + sw / 2, ex = w / 2 - L2 / (2 * n2);
        k.stroke(k.poly([[cx, h / 2 - L1 / (2 * n1)], [cx, cy], [ex, cy]], false) + k.arrowHead(ex, cy, 1, 0, sw * 0.3));
      },
    },
    'stairs-u': {
      name: 'Stairs (U-shaped)', width: 7, length: 9,
      draw(k, w, h) {
        const ld = Math.min(h * 0.35, w * 0.5), x0 = -w / 2, y0 = -h / 2, yl = y0 + ld, L = h - ld;   // ld = landing depth
        const n = Math.max(2, Math.round(L / k.tread));
        let d = k.box(x0, y0, w / 2, h / 2) + k.line(x0, yl, w / 2, yl) + k.line(0, yl, 0, h / 2);
        for (let i = 1; i < n; i++) { const y = yl + i * L / n; d += k.line(x0, y, 0, y) + k.line(0, y, w / 2, y); }
        k.stroke(d);
        const yb = h / 2 - L / (2 * n), ym = y0 + ld / 2;
        k.stroke(k.poly([[-w / 4, yb], [-w / 4, ym], [w / 4, ym], [w / 4, yb]], false) + k.arrowHead(w / 4, yb, 0, 1, Math.min(w / 2, ld) * 0.35));
      },
    },
    'door': {
      name: 'Door / opening', width: 3, length: 3, keepSquare: true, snapToWall: true,
      flipLeftRightLabel: 'Flip hinge side', flipUpDownLabel: 'Flip swing',
      draw(k, w, h) {
        const x0 = -w / 2, y1 = h / 2;            // hinge at the lower left; the door stands open 90 degrees
        k.stroke(k.line(x0, y1, x0, y1 - w) + k.arc(x0, y1 - w, x0 + w, y1, w));
      },
    },
  },
};
</script>

<script>
"use strict";
/* =============================================================================
   PART C.  THE PROGRAM
   The sections below are numbered 1 to 7 (see the table at the top of the file).
   Most changes people want can be made in Part A instead.
   ============================================================================= */

/* ============================================================================
   1. GEOMETRY
   Pure math only: lengths, angles, square footage and shape checks. Nothing here
   knows about the screen, the mouse or files.
   Units are feet. x grows to the right and y grows DOWNWARD (the screen convention).
   Tolerances (feet). All are far smaller than anything a tape measure can show:
     EPS      1e-9  two points closer than this are the same point (closure test)
     ON_EPS   1e-7  point-on-boundary tolerance for validity/containment tests
     LEN_EPS  1e-7  shortest wall length that counts as a wall
     AREA_EPS 1e-7  smallest area (sf) that counts as an area
   ============================================================================ */
const Geo = (() => {
  const EPS = 1e-9, ON_EPS = 1e-7, LEN_EPS = 1e-7, AREA_EPS = 1e-7;
  const DIRS = { right:{x:1,y:0}, left:{x:-1,y:0}, up:{x:0,y:-1}, down:{x:0,y:1} };
  const DIR_LABEL = { right:'Right', left:'Left', up:'Up', down:'Down' };

  // Round half up to one decimal with a tiny tolerance so 420.25 -> 420.3
  // even when floating point stores it as 420.2499999999.
  function round1(v) {
    if (!isFinite(v)) return NaN;

    if (f.categoryId && f.categoryId !== d.categoryId) {
      const c = Model.catById(this.doc, f.categoryId);
      if (c) { d.categoryId = c.id; d.level = c.defaultLevel; if (!d.nameEdited) d.name = this.suggestName(c.name, d.post); }
    }
    if (typeof f.name === 'string') { d.name = f.name.slice(0, Model.NAME_MAX); d.nameEdited = true; }
    if (f.level) d.level = f.level;
    if (typeof f.separate === 'boolean') d.separate = f.separate;
    this.changed();
  }
  // Define an area drawn in Draw mode (category, name, level), usually right after it closes.
  // opts.coalesce: the choice belongs to the step just taken (Duplicate Area) and joins its undo step.
  openDefineFor(areaId, opts = {}) {
    const a = this.area(areaId); if (!a) return false;
    const prev = { mode: this.mode, activeAreaId: null, inp: this.inp.snapshot(), pen: this.pen, penInp: this.pen ? this.pen.inp.snapshot() : null,
      selection: Model.clone(this.selection), escCount: 0 };
    const cat = Model.catById(this.doc, a.categoryId) || this.doc.categories[0];
    this.define = { prev, post: a.id, coalesce: !!opts.coalesce, categoryId: cat.id, name: a.pendingDefine ? this.suggestName(cat.name) : a.name,
      level: a.level, separate: false, nameEdited: !a.pendingDefine && !opts.coalesce };
    this.mode = 'define';
    this.changed(); return true;
  }
  applyDefine() {
    const d = this.define; if (!d) return;
    const cat = Model.catById(this.doc, d.categoryId);
    const name = (d.name || '').replace(/[\r\n]+/g, ' ').trim().slice(0, Model.NAME_MAX) || this.suggestName(cat ? cat.name : 'Area', d.post);
    if (d.post) {
      const top = this.hist.top(), coalesce = d.coalesce && top && top.label.indexOf('Duplicate') === 0;
      const a = this.area(d.post), p = d.prev, before = coalesce ? top.before : this.snap();
      this.define = null;
      this.mode = p.mode === 'penup' && !p.pen ? 'select' : p.mode; this.pen = p.pen; if (this.pen) this.pen.inp.load(p.penInp);
      this.selection = p.selection;
      if (!a) { this.changed(); return; }
      a.categoryId = d.categoryId; a.name = name; a.level = d.level; a.pendingDefine = false;
      this.lastCategoryId = d.categoryId;
      if (coalesce) this.amend(); else this.push('Define ' + name, before);
      const st = Model.areaStatus(a);
      this.say(name + ' defined' + (st.status === 'closed' ? ': ' + Geo.fmtSF(st.area) + ' gross.' : '.'), 'ok');
      this.afterGeometry(before.doc); this.amend(); this.changed();
      return;
    }
    if (d.prev.mode === 'drawing') {
      const a = this.area(d.prev.activeAreaId);
      if (a && !a.walls.length) this.dropEmptyArea(a);

    }

    this.lastCategoryId = d.categoryId;
    let groupId = null, offset = { x: 0, y: 0 };
    if (!d.separate) {
      let g = this.activeGroupId && this.doc.groups.some(x => x.id === this.activeGroupId) ? this.activeGroupId : null;
      if (!g && this.doc.areas.length) g = this.doc.areas[this.doc.areas.length - 1].groupId;
      if (g) {
        groupId = g;
        const inG = this.doc.areas.filter(a => a.groupId === g), sameLvl = inG.filter(a => a.level === d.level);
        const ref = (sameLvl.length ? sameLvl : inG).slice(-1)[0];
        if (ref) offset = { x: ref.layoutOffset.x, y: ref.layoutOffset.y };
      }

    this.pen = { name, categoryId: d.categoryId, level: d.level, groupId, offset, separate: d.separate,
      inp: new MoveInput(), kb: false, base: null, takeover: null };
    this.define = null; this.mode = 'penup'; this.escCount = 0; this.selection = [];
    if (!this.msg || this.msg.text.indexOf('left Open') < 0) this.say('Place the starting point for ' + name + ', then press Enter.');
    this.changed();
  }
  cancelDefine() {
    const d = this.define, p = d.prev; this.define = null;
    if (d.post) {
      this.mode = p.mode === 'penup' && !p.pen ? 'select' : p.mode; this.pen = p.pen; if (this.pen) this.pen.inp.load(p.penInp);
      this.selection = p.selection;
      const a = this.area(d.post), top = this.hist.top();
      if (a && a.pendingDefine) this.say(a.name + ' is not counted until it has a category (select it, then Define area in Properties).', 'warn');
      if (a && d.coalesce && top && top.label.indexOf('Duplicate') === 0) {    // keep the suggested category/name/level
        this.say(a.name + ' kept its suggested category, name and level. Change them in Properties if needed.');
        this.afterGeometry(top.before.doc); this.amend();
      }
      this.changed(); return;
    }
    this.mode = p.mode; this.activeAreaId = p.activeAreaId; this.inp.load(p.inp);
    this.pen = p.pen; if (this.pen) this.pen.inp.load(p.penInp);
    this.selection = p.selection; this.escCount = p.escCount;

    this.changed();
  }

  /* ---- Pen up: placing the starting point ---- */
  penMouseRes(p) {
    // New Area (F4) snaps to outlines on the chosen level; Draw mode snaps to any level
    // (a later area wins a tie, so the one drawn on top is picked).
    const pen = this.pen, r = this.snapRadius(), areas = this.doc.areas.filter(a => pen.drawTool || a.level === pen.level);
    let best = null;
    for (const a of areas) for (const c of a.corners) {
      const d = Geo.dist(p, Model.disp(a, c));
      if (d <= r && (!best || d <= best.d + 1e-12)) best = { d, area: a, pt: { x: c.x, y: c.y }, kind: 'corner', nodeId: c.id };
    }
    if (!best) for (const a of areas) {
      const m = this.toMeas(p, a.layoutOffset);
      for (let i = 0; i < a.walls.length; i++) {
        const [s, e] = Model.wallEnds(a, i), q = Geo.distPointSeg(m, s, e);
        if (q.d <= r && (!best || q.d < best.d - 1e-12)) best = { d: q.d, area: a, pt: q.q, kind: 'wall' };
      }
    }
    if (best) return { pt: best.pt, groupId: pen.separate ? pen.groupId : best.area.groupId, level: best.area.level,
      offset: { x: best.area.layoutOffset.x, y: best.area.layoutOffset.y }, snap: { kind: best.kind, page: Model.disp(best.area, best.pt) },
      node: best.nodeId ? { areaId: best.area.id, id: best.nodeId } : null };
    // Line the start point up with corners placed the same way on the page (each axis on its own).
    const m = this.toMeas(p, pen.offset), guides = [];
    for (const key of ['x', 'y']) {
      let bb = null;
      for (const a of areas) {
        if (!Geo.same(a.layoutOffset, pen.offset, 1e-9)) continue;
        for (const c of a.corners) { const d = Math.abs(c[key] - m[key]); if (d <= r && (!bb || d < bb.d - 1e-12)) bb = { d, c }; }
      }
      if (bb) { m[key] = bb.c[key]; guides.push(bb.c); }
    }
    return { pt: m, groupId: pen.groupId, offset: { x: pen.offset.x, y: pen.offset.y }, snap: guides.length ? { kind: 'align', guides } : null };
  }
  penRes() {
    const pen = this.pen;
    if (pen.kb) {
      const moved = pen.inp.moves.length > 0 || pen.inp.editing !== null;
      return { pt: pen.inp.endpoint(pen.base.pt), groupId: pen.base.groupId, offset: pen.base.offset, level: pen.base.level, snap: null, kb: true, node: moved ? null : pen.base.node };
    }
    return this.penMouseRes(this.mouse || { x: pen.offset.x, y: pen.offset.y });
  }
  penTakeover() {
    const pen = this.pen; if (pen.kb) return;
    const r = this.penRes();
    pen.base = { pt: { x: r.pt.x, y: r.pt.y }, groupId: r.groupId, offset: r.offset, level: r.level, node: r.node };
    pen.kb = true; pen.takeover = this.mouse ? { x: this.mouse.x, y: this.mouse.y } : null;
  }
  keyPen(k, m) {
    const pen = this.pen, inp = pen.inp, dir = Engine.dirOf(k);
    if (Engine.isNum(k)) { if (inp.typeChar(k) === 'reject') this.cue(); return; }
    if (dir) {
      if (m.ctrl) {
        if (inp.token !== null || inp.editing !== null) { this.say('Finish the typed number with an arrow (or Backspace) before Ctrl+arrow.'); return; }
        this.penTakeover();
        const cur = inp.endpoint(pen.base.pt), off = pen.base.offset;
        const corners = this.doc.areas.filter(a => a.level === pen.level && Geo.same(a.layoutOffset, off, 1e-9) && (!pen.base.groupId || a.groupId === pen.base.groupId)).flatMap(a => a.corners);
        this.pushAlign(inp, cur, dir, corners); return;
      }
      if ((inp.token !== null && Geo.tokenValue(inp.token) === null)) { this.say('Type a complete number first.'); return; }
      this.penTakeover();
      if (inp.arrow(dir, m.shift) === 'incomplete') this.say('Type a complete number first.');
      return;
    }
    switch (k) {
      case 'Enter':
        if (inp.token !== null) { this.say('Press an arrow to move the start point ' + inp.token + ' ft that way (or Backspace to remove it).'); return; }
        if (inp.editing !== null) {
          if (Geo.tokenValue(inp.moves[inp.editing].text) === null) { this.say('Finish the number, or press Backspace to remove it.'); return; }
          inp.editing = null;
        }
        this.penDown(this.penRes()); return;
      case 'Backspace': case 'Delete': inp.backspace(); return;
      case 'Escape':
        if (inp.hasInput || pen.kb) { inp.clear(); pen.kb = false; this.say('Start point input cleared; the mouse positions it again.'); }
        else if (pen.drawTool) { this.stopDrawing(); this.say('Left Draw mode.'); }
        else { this.pen = null; this.mode = 'select'; this.say('New area cancelled. Nothing was created.'); }
        return;
      case 'F4': this.openDefine(); return;
    }
  }
  penClick(p) {
    const pen = this.pen;
    if (pen.inp.token !== null) { this.say('Press an arrow to apply ' + pen.inp.token + ' first (or Backspace).'); return; }
    if (pen.kb) { pen.inp.editing = null; this.penDown(this.penRes()); return; }   // click confirms the keyboard position

  }
  penDown(res) {
    const pen = this.pen;
    // Draw mode on an existing corner: keep drawing THAT area from there (no new area).
    // A locked area keeps its walls: a new area starts from its corner instead.
    let lockedFrom = null;
    if (pen.drawTool && res.node) {
      const a = this.area(res.node.areaId);
      if (a && a.locked) lockedFrom = a;
      else if (a && Model.nodeOf(a, res.node.id)) {
        this.pen = null; this.beginStroke(a, res.node.id);
        this.say('Drawing ' + a.name + ' from this corner. Type a distance and press an arrow; Esc twice lifts the pen.');
        return;
      }
    }
    if (!Model.inRange(res.pt)) { this.sayTooFar(); return; }
    const before = this.snap();
    let groupId = res.groupId;
    if (!groupId || !this.doc.groups.some(g => g.id === groupId)) {
      groupId = this.nid('g');
      this.doc.groups.push({ id: groupId, name: 'Sketch ' + (this.doc.groups.length + 1) });
    }
    const f = pen.drawTool
      ? { name: this.suggestName('Area'), categoryId: pen.categoryId, level: res.level || pen.level, pendingDefine: true }
      : { name: pen.name, categoryId: pen.categoryId, level: pen.level };
    const area = Model.newArea(this.doc, Object.assign(f, { groupId, layoutOffset: res.offset }));
    const node = { id: this.nid('c'), x: res.pt.x, y: res.pt.y };
    area.corners.push(node);
    this.doc.areas.push(area);
    this.pen = null; this.beginStroke(area, node.id);
    this.push('Start ' + area.name, before);
    if (lockedFrom) this.say(lockedFrom.name + ' is locked, so a new area starts from its corner. You will pick its category when it closes.');
    else this.say('Pen down for ' + area.name + '. Type a distance and press an arrow.' + (area.pendingDefine ? ' You will pick its category when it closes.' : ''));
  }

  // Ctrl+arrow: exact move to the next distinct corner coordinate beyond cur.
  pushAlign(inp, cur, dir, corners) {
    const axis = (dir === 'left' || dir === 'right') ? 'x' : 'y', sign = (dir === 'right' || dir === 'down') ? 1 : -1;
    const v = Geo.nextAlign(cur[axis], corners.map(c => c[axis]), sign);
    if (v === null) { this.say('No alignment point further ' + dir + '.'); return false; }
    inp.moves.push({ gen: { axis, to: v, dist: Math.abs(v - cur[axis]) }, dir, text: '' });
    return true;
  }

  /* ---- Drawing walls ---- */
  keyDraw(k, m) {
    const inp = this.inp, dir = Engine.dirOf(k);
    if (Engine.isNum(k)) { this.clearPost(); this.escCount = 0; if (inp.typeChar(k) === 'reject') this.cue(); return; }
    if (dir) {
      this.clearPost(); this.escCount = 0;
      if (m.ctrl) {
        if (inp.token !== null || inp.editing !== null) { this.say('Finish the typed number with an arrow (or Backspace) before Ctrl+arrow.'); return; }
        const a = this.activeArea();
        this.pushAlign(inp, inp.endpoint(this.anchor()), dir, this.compatAreas(a.level, a.groupId, a.layoutOffset).flatMap(o => o.corners));
        return;
      }
      if (inp.arrow(dir, m.shift) === 'incomplete') this.say('Type a complete number first (a lone decimal point is not a number).');
      return;
    }
    switch (k) {
      case 'Enter': this.enterDraw(); return;
      case 'Backspace': case 'Delete':
        this.clearPost(); this.escCount = 0;
        if (inp.backspace() === 'none') this.say('Nothing typed to fix. Use Ctrl+Z to undo a committed wall.');
        return;
      case 'Escape': this.escDraw(); return;
      case 'a': case 'x': case 'y': this.closeKey(k); return;
      case 'Space': this.spaceHide(); return;
      case 'F4': this.openDefine(); return;
    }
  }
  enterDraw() {
    const inp = this.inp;
    if (inp.editing !== null) {
      if (Geo.tokenValue(inp.moves[inp.editing].text) === null) { this.say('Finish the number, or press Backspace to remove it.'); return; }
      inp.editing = null; this.commitKeys(); return;
    }
    if (inp.token !== null) {
      if (inp.moves.length) { this.say('Press an arrow to give ' + inp.token + ' a direction, or Backspace to remove it.'); return; }
      const L = Geo.tokenValue(inp.token);
      if (L === null) { this.say('Finish the number first.'); return; }
      if (!(L > 0)) { this.say('A wall must be longer than zero.'); return; }
      const r = this.typedEndpoint(L);
      if (!r) { this.say('Move the mouse to show the direction, or press an arrow key.'); return; }
      this.clearPost(); this.commitEndpoint(r.pt); return;
    }
    if (inp.moves.length) { this.commitKeys(); return; }
    // A free mouse preview or nothing pending: Enter does nothing (extra Enter is harmless).
  }
  commitKeys() {
    const anchor = this.anchor(), pt = this.inp.endpoint(anchor);
    if (Geo.dist(pt, anchor) <= Geo.LEN_EPS) { this.say('Those moves add up to zero length. Nothing was drawn; fix them or press Esc.', 'warn'); return; }
    this.clearPost(); this.commitEndpoint(pt);
  }
  drawClick(p, mods) {
    this.mouse = { x: p.x, y: p.y }; this.shift = !!(mods && mods.shift);
    if (this.inp.moves.length || this.inp.editing !== null) { this.say('Press Enter to finish this wall, or Esc to clear it.'); return; }
    this.escCount = 0;
    if (this.inp.token !== null) {
      const L = Geo.tokenValue(this.inp.token);
      if (!(L > 0)) { this.say('Finish the number first.'); return; }
      const r = this.typedEndpoint(L);
      if (!r) { this.say('Move the mouse away from the corner to show the direction.'); return; }
      this.clearPost(); this.commitEndpoint(r.pt); return;
    }
    this.updateAxisLock();
    const r = this.mouseEndpoint();
    if (r.zero) { this.say('Move the mouse away from the corner to draw a wall.'); return; }
    this.clearPost(); this.commitEndpoint(r.pt);
  }
  // Commit one wall from the pen to pt. Ending exactly on a corner of this area joins that
  // corner (no duplicate corner). If the walls then form one closed loop the area closes;
  // otherwise joining an existing corner lifts the pen there.
  commitEndpoint(pt) {
    const a = this.activeArea(), anchor = this.anchor();
    if (!Geo.finitePt(pt)) { this.say('That point is not a valid number.', 'err'); return false; }
    if (!Model.inRange(pt)) { this.sayTooFar(); return false; }
    if (Geo.dist(pt, anchor) <= Geo.LEN_EPS) { this.say('A wall must be longer than zero.'); return false; }
    const hit = a.corners.find(c => c.id !== anchor.id && Geo.same(c, pt, Geo.EPS)) || null;
    if (hit && a.walls.some(w => (w.a === anchor.id && w.b === hit.id) || (w.a === hit.id && w.b === anchor.id))) {
      this.say('There is already a wall between those two corners. Nothing was drawn.'); return false;
    }
    const before = this.snap();
    this.escCount = 0; this.inp.clear(); this.previewHidden = false; this.axisLock = null;
    const node = hit || { id: this.nid('c'), x: pt.x, y: pt.y };
    if (!hit) a.corners.push(node);
    const w = { id: this.nid('w'), a: anchor.id, b: node.id, dim: Model.newDim() };
    a.walls.push(w);
    if (Model.syncClosed(a)) { this.prevId = anchor.id; this.anchorId = node.id; this.afterClose(a, w, before, 'Close ' + a.name); return true; }
    if (hit) {
      this.liftPen(true);
      this.push('Draw wall', before);
      this.postCommit = { areaId: a.id, wallId: w.id, hist: this.hist.index };
      this.say('Joined an existing corner of ' + a.name + '; the pen is up. ' + Model.areaStatus(a).reason +
        (a.closed ? '' : '. Delete any extra wall, or click an open end (orange circle) in Draw mode to keep going.'), 'warn');
      return true;
    }
    this.prevId = anchor.id; this.anchorId = node.id;
    if (this.doc.settings.enterMode === 'classic') { this.mode = 'dimstep'; this.dim = { areaId: a.id, wallId: w.id, closing: false }; }
    this.push('Draw wall', before);
    this.postCommit = { areaId: a.id, wallId: w.id, hist: this.hist.index };
    return true;
  }
  afterClose(a, w, before, label) {
    const st = Model.areaStatus(a);
    if (st.status === 'closed') Model.placeDimsOutside(a, st.signed);
    this.selection = [{ t: 'area', id: a.id }];
    if (this.doc.settings.enterMode === 'classic') {
      this.mode = 'dimstep'; this.dim = { areaId: a.id, wallId: w.id, closing: true };
      this.push(label, before); this.postCommit = null;
      return;
    }
    this.liftPen(true);
    this.selection = [{ t: 'area', id: a.id }];
    this.push(label, before);
    this.postCommit = { areaId: a.id, wallId: w.id, hist: this.hist.index };
    this.finishClose(a, before);
  }
  finishClose(a, before) {
    if (this.mode === 'dimstep' || this.mode === 'drawing') this.liftPen(true);
    this.dim = null; this.selection = [{ t: 'area', id: a.id }]; this.activeGroupId = a.groupId;
    const st = Model.areaStatus(a);
    if (st.status === 'invalid') this.say(a.name + ' is closed but INVALID: ' + st.reason + ' It is not counted.', 'err');
    else this.say(a.name + ' closed: ' + Geo.fmtSF(st.area) + ' gross.', 'ok');
    if (a.pendingDefine && st.status === 'closed') { this.amend(); this.openDefineFor(a.id); return; }   // containment is checked once it has a category
    this.afterGeometry(before.doc);
    this.amend();
  }
  closeKey(k) {
    if (this.inp.hasInput) { this.say('Press Enter to finish this wall, or Esc to clear it.'); return; }
    this.clearPost(); this.escCount = 0;
    const a = this.activeArea(), anchor = this.anchor(), target = this.closureTarget();
    if (!target) { this.say(k === 'a' ? 'Nothing to close to from here. Draw to a corner, or press Esc twice to lift the pen.' : 'There is no start point to line up with from here.'); return; }
    if (k === 'a') {
      if (a.walls.some(w => (w.a === anchor.id && w.b === target.id) || (w.a === target.id && w.b === anchor.id))) { this.say('Draw at least two walls before closing with A.'); return; }
      this.commitEndpoint({ x: target.x, y: target.y });
      return;
    }
    const pt = k === 'x' ? { x: target.x, y: anchor.y } : { x: anchor.x, y: target.y };
    if (Geo.dist(pt, anchor) <= Geo.LEN_EPS) { this.say(k.toUpperCase() + ' would make a zero-length wall here. Nothing was drawn.'); return; }
    this.commitEndpoint(pt);
  }
  escDraw() {
    if (this.inp.hasInput) { this.inp.clear(); this.escCount = 1; this.say('Pending wall cleared. Press Esc again to lift the pen.'); return; }
    if (this.escCount >= 1) {
      const a = this.activeArea(), empty = a && !a.walls.length;
      if (empty) this.dropEmptyArea(a);
      this.liftPen(!empty);
      if (this.tool === 'draw') this.say('Pen lifted. Click a corner to keep drawing an area, or click anywhere to start a new one.');
      else if (a && !empty) this.say(a.name + ' stays ' + (a.closed ? 'as it is' : 'Open (not counted)') + '. Use Draw and click one of its corners to keep drawing it.');
      return;
    }
    this.escCount = 1; this.previewHidden = true;
    this.say('Press Esc again to lift the pen.');
  }
  // An area whose pen went down but got no wall is removed when the pen lifts.
  dropEmptyArea(a) {
    const top = this.hist.top();
    if (top && !top.before.doc.areas.some(x => x.id === a.id)) {        // its "Start" step is the last one: take it back
      Model.restoreDoc(this.doc, top.before.doc);
      this.hist.stack.pop(); this.hist.index = this.hist.stack.length; this.docRev++;
    } else { this.doc.areas = this.doc.areas.filter(x => x.id !== a.id); this.touch(); }
  }
  // Quick mode: Space hides the just-committed wall's dimension (coalesced with that commit).
  spaceHide() {
    const pc = this.postCommit; if (!pc) return;
    this.postCommit = null;
    const a = this.area(pc.areaId), w = a && a.walls.find(x => x.id === pc.wallId);
    if (!w) return;
    if (this.hist.index === pc.hist && this.hist.top()) { w.dim.hidden = true; this.amend(); }
    else { const before = this.snap(); w.dim.hidden = true; this.push('Hide dimension', before); }
    this.say('Dimension hidden. Select the wall later to show it again.');
  }

  /* ---- Classic mode dimension step ---- */
  dimWall() { const a = this.area(this.dim.areaId); const i = a.walls.findIndex(w => w.id === this.dim.wallId); return { a, i, w: a.walls[i] }; }
  keyDim(k, m) {
    const dir = Engine.dirOf(k);
    if (Engine.isNum(k)) {
      const closing = this.dim.closing;
      this.acceptDim();
      if (!closing && this.mode === 'drawing') { this.escCount = 0; if (this.inp.typeChar(k) === 'reject') this.cue(); }
      return;
    }
    if (dir) { if (!m.ctrl) this.nudgeDim(dir, m.shift ? 0.1 : 1); return; }
    switch (k) {
      case 'Enter': case 'Escape': this.acceptDim(); return;
      case 'Space': this.dimWall().w.dim.hidden = true; this.amend(); this.acceptDim(); return;

  /* ---- Select tool ---- */

      labels: s.labels.map(id => { const l = this.doc.labels.find(q => q.id === id); return { id, x: l.x, y: l.y }; }),
      symbols: s.symbols.map(id => { const q = this.doc.symbols.find(x => x.id === id); return { id, x: q.x, y: q.y, rot: q.rot, flip: q.flip }; }),

        const p = w1.a === ref.id ? w1.b : w1.a, q = w2.a === ref.id ? w2.b : w2.a;
        let na = p, nb = q;                                        // keep the drawing direction through the corner
        if (w2.b === ref.id && w1.a === ref.id) { na = q; nb = p; }
        const exists = p === q || a.walls.some((w, i) => i !== ws[0] && i !== ws[1] && ((w.a === p && w.b === q) || (w.a === q && w.b === p)));

        if (!exists) a.walls.splice(Math.min(ws[0], ws[1]), 0, { id: this.nid('w'), a: na, b: nb, dim: Model.newDim() });
      } else a.walls = a.walls.filter((w, i) => !ws.includes(i));

  /* ---- Wall length editing ---- */

      initText: Geo.fmt1(L), text: Geo.fmt1(L), dirty: false, cand: null, error: null, bad: [] };

  /* ---- Properties edits (each is one undo step) ---- */

  setBoundLabelHidden(id, which, hidden) { const a = this.area(id); const L = a[which === 'aname' ? 'nameLabel' : 'sfLabel']; return this.edit(hidden ? 'Hide label' : 'Show label', () => { L.hidden = hidden; }); }

    let cat = nextId ? Model.catById(this.doc, nextId) : null;
    if (!cat) {

  /* ---- Symbols (stairs, doors and any added in Part A): diagram only, never part of

  // Midpoint of a wall symbol's opening edge (the edge that sits on the wall), page feet.
  doorEdge(sym) {

  ownerOf(pt, onWall) {

      if (!on && onWall) on = a.walls.some((w, i) => { const [s, e] = Model.wallEnds(a, i); return Geo.distPointSeg(m, s, e).d <= 1; });

  addAttached(s) {

    for (const l of this.doc.labels) if (!labels.has(l.id) && set.has(this.ownerOf(l, false))) s.labels.push(l.id);

  snapDoor(sym, p) {

    let best = null;
    for (const a of this.doc.areas) {
      const m = { x: p.x - a.layoutOffset.x, y: p.y - a.layoutOffset.y };
      for (let i = 0; i < a.walls.length; i++) {

    if (!best || Geo.dist(best.s, best.e) <= Geo.LEN_EPS) return false;

  flipSymbol(id, which) {

    const def = Model.SYMBOLS[s.type] || { flipH: 'Flip left-right', flipV: 'Flip up-down' };
    return this.edit(which === 'h' ? def.flipH : def.flipV, () => {

  }

  symHandles() {

    if (Number.isFinite(f.rot)) s.rot = ((f.rot % 360) + 360) % 360;
    else if (Model.isWallSymbol(s)) {                               // resizing a door keeps its opening on the wall
      const r = s.rot * Math.PI / 180; s.x = edge.x + Math.sin(r) * s.h / 2; s.y = edge.y - Math.cos(r) * s.h / 2;
    }
    this.changed();
  }
  symEditEnd(label) {
    const E = this.symEdit; this.symEdit = null; if (!E) return;
    const now = JSON.stringify(this.doc.symbols.find(x => x.id === E.id)), was = JSON.stringify(E.before.doc.symbols.find(x => x.id === E.id));
    if (now !== was) this.push(label, E.before);
    this.changed();
  }

  /* ---- Rotate, mirror, copy and paste ---- */
  // What rotate / mirror / copy act on: whole areas (with their items), labels, symbols.
  transformSet() {
    const s = this.addAttached(this.selParts());
    const areas = s.areas.map(id => this.area(id)).filter(Boolean);
    const labels = s.labels.map(id => this.doc.labels.find(l => l.id === id)).filter(Boolean);
    const syms = s.symbols.map(id => this.doc.symbols.find(q => q.id === id)).filter(Boolean);
    return { areas, labels, syms, empty: !areas.length && !labels.length && !syms.length };
  }
  setBox(t) {
    const pts = [];
    for (const a of t.areas) for (const c of a.corners) pts.push(Model.disp(a, c));
    for (const l of t.labels) pts.push(l);
    for (const q of t.syms) pts.push(...Model.symbolCorners(q));
    const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
    const x1 = Math.min(...xs), x2 = Math.max(...xs), y1 = Math.min(...ys), y2 = Math.max(...ys);
    return { x1, x2, y1, y2, c: { x: (x1 + x2) / 2, y: (y1 + y2) / 2 } };
  }
  // Rotation about c by deg (clockwise on screen); exact for multiples of 90 degrees.
  rotMap(c, deg) {
    const k = ((deg % 360) + 360) % 360, exact = { 0: [1, 0], 90: [0, 1], 180: [-1, 0], 270: [0, -1] }[k];
    const [co, si] = exact || [Math.cos(deg * Math.PI / 180), Math.sin(deg * Math.PI / 180)];
    return (p) => ({ x: c.x + (p.x - c.x) * co - (p.y - c.y) * si, y: c.y + (p.x - c.x) * si + (p.y - c.y) * co });
  }
  // Apply a page-space rotation or mirror. Measured corners move with it (lengths and areas
  // are unchanged); text stays upright; dimensions are placed outside again.
  applyMap(t, f, rotDeg, mirror) {
    for (const a of t.areas) {
      const o = a.layoutOffset, g = (p) => { const q = f({ x: p.x + o.x, y: p.y + o.y }); return { x: q.x - o.x, y: q.y - o.y }; };
      for (const c of a.corners) { const q = g(c); c.x = q.x; c.y = q.y; }
      for (const w of a.walls) {
        if (w.dim.manual) { const q = g(w.dim); w.dim.x = q.x; w.dim.y = q.y; }
        else if (mirror) w.dim.side = -(w.dim.side || 1);
      }
      for (const L of [a.nameLabel, a.sfLabel]) if (L.manual) { const q = g(L); L.x = q.x; L.y = q.y; }
      const st = Model.areaStatus(a);
      if (st.status === 'closed') Model.placeDimsOutside(a, st.signed);
    }
    for (const l of t.labels) { const q = f(l); l.x = q.x; l.y = q.y; }
    for (const s of t.syms) {
      const q = f(s); s.x = q.x; s.y = q.y;
      if (mirror === 'h') { s.rot = -(s.rot || 0); s.flip = !s.flip; }
      else if (mirror === 'v') { s.rot = 180 - (s.rot || 0); s.flip = !s.flip; }
      else s.rot = (s.rot || 0) + rotDeg;
      s.rot = ((s.rot % 360) + 360) % 360;
    }
  }
  mirrorSelection(axis) {
    if (this.mode !== 'select') return false;
    const t = this.transformSet();
    if (t.empty) { this.say('Select an area, label or symbol first, then mirror it.'); return false; }
    const lk = t.areas.find(a => a.locked); if (lk) { this.sayLocked(lk); return false; }
    const c = this.setBox(t).c, before = this.snap();
    this.applyMap(t, axis === 'h' ? (p) => ({ x: 2 * c.x - p.x, y: p.y }) : (p) => ({ x: p.x, y: 2 * c.y - p.y }), 0, axis);
    this.push(axis === 'h' ? 'Mirror left-right' : 'Mirror top-bottom', before);
    this.say('Mirrored ' + (axis === 'h' ? 'left-right' : 'top-bottom') + '. Wall lengths and square footage are unchanged.', 'ok');
    if (t.areas.length) { this.afterGeometry(before.doc); this.amend(); }
    this.changed(); return true;
  }
  rotateSelection(deg) {
    if (this.mode !== 'select') return false;
    const t = this.transformSet();
    if (t.empty) { this.say('Select an area, label or symbol, then press R to rotate it.'); return false; }
    const lk = t.areas.find(a => a.locked); if (lk) { this.sayLocked(lk); return false; }
    const before = this.snap();
    this.applyMap(t, this.rotMap(this.setBox(t).c, deg), deg, null);
    this.push('Rotate ' + deg + ' degrees', before);
    if (t.areas.length) { this.afterGeometry(before.doc); this.amend(); }
    this.changed(); return true;
  }
  rotateSymbols(deg) { return this.rotateSelection(deg); }
  // Rotate tool: the selection follows the mouse around its centre (15 degree steps, Shift
  // free) or a typed angle; Enter or click finishes, Esc cancels; one undo step.
  startRotate() {
    if (this.mode !== 'select') return false;
    const t = this.transformSet();
    if (t.empty) { this.say('Select what you want to rotate first (click it or drag a box around it).'); this.changed(); return false; }
    const lk = t.areas.find(a => a.locked); if (lk) { this.sayLocked(lk); this.changed(); return false; }
    const c = this.setBox(t).c;
    this.rot = { before: this.snap(), c, angle: 0, typed: '', start: this.mouse ? Math.atan2(this.mouse.y - c.y, this.mouse.x - c.x) * 180 / Math.PI : null,
      ids: { areas: t.areas.map(a => a.id), labels: t.labels.map(l => l.id), syms: t.syms.map(s => s.id) } };
    this.mode = 'rotate'; this.clearPost();
    this.say('Rotate: move the mouse around the selection (Shift: any angle) or type an angle; Enter or click finishes, Esc cancels.');
    this.changed(); return true;
  }
  applyRotation(angle) {
    const R = this.rot;
    Model.restoreDoc(this.doc, R.before.doc);
    const t = { areas: R.ids.areas.map(id => this.area(id)), labels: R.ids.labels.map(id => this.doc.labels.find(l => l.id === id)), syms: R.ids.syms.map(id => this.doc.symbols.find(q => q.id === id)) };
    if (angle) this.applyMap(t, this.rotMap(R.c, angle), angle, null);
    R.angle = angle; this.docRev++;
  }
  rotateTrack(p, mods = {}) {
    const R = this.rot; if (!R || R.typed) return;
    const a = Math.atan2(p.y - R.c.y, p.x - R.c.x) * 180 / Math.PI;
    if (R.start === null) { R.start = a; return; }
    let ang = a - R.start;
    while (ang > 180) ang -= 360;
    while (ang <= -180) ang += 360;
    if (!this.shift && !mods.shift) ang = Math.round(ang / 15) * 15;
    else ang = Math.round(ang * 10) / 10;
    if (ang !== R.angle) this.applyRotation(ang);
  }
  keyRotate(k) {
    const R = this.rot; if (!R) return;
    if (k === 'Enter') { this.confirmRotate(); return; }
    if (k === 'Escape') { this.cancelRotate(); return; }
    if (Engine.isNum(k) || k === '-' || k === 'Backspace') {
      R.typed = k === 'Backspace' ? R.typed.slice(0, -1) : (R.typed + k).slice(0, 8);
      const v = parseFloat(R.typed);
      this.applyRotation(Number.isFinite(v) ? v : 0);
    }
  }
  confirmRotate() {
    const R = this.rot; if (!R) return;
    this.rot = null; this.mode = 'select';
    if (!R.angle) { Model.restoreDoc(this.doc, R.before.doc); this.docRev++; this.say('Not rotated (0 degrees).'); return; }
    this.push('Rotate ' + Geo.fmt1(R.angle) + ' degrees', R.before);
    this.say('Rotated ' + Geo.fmt1(R.angle) + ' degrees. Wall lengths and square footage are unchanged.', 'ok');
    if (R.ids.areas.length) { this.afterGeometry(R.before.doc); this.amend(); }
  }
  cancelRotate() {
    const R = this.rot; if (!R) return;
    Model.restoreDoc(this.doc, R.before.doc); this.rot = null; this.mode = 'select'; this.docRev++;
    this.say('Rotation cancelled.');
  }

  // Copy / cut / paste (an in-window clipboard). Areas come with their labels and symbols.
  copySelection(cut) {
    const t = this.transformSet();
    if (t.empty) { this.say('Select areas, labels or symbols to copy (click them or drag a box around them).'); return false; }
    if (cut) { const lk = t.areas.find(a => a.locked); if (lk) { this.sayLocked(lk); return false; } }
    const ids = new Set(t.areas.map(a => a.id)), decisions = {};
    for (const k of Object.keys(this.doc.decisions)) { const [p, c] = k.split('>'); if (ids.has(p) && ids.has(c)) decisions[k] = this.doc.decisions[k]; }
    const box = this.setBox(t), n = t.areas.length + t.labels.length + t.syms.length;
    this.clip = { areas: Model.clone(t.areas), labels: Model.clone(t.labels), syms: Model.clone(t.syms), decisions, box, pastes: 0 };
    if (cut) {
      this.selection = [...t.areas.map(a => ({ t: 'area', id: a.id })), ...t.labels.map(l => ({ t: 'label', id: l.id })), ...t.syms.map(s => ({ t: 'symbol', id: s.id }))];
      this.deleteSelection();
      this.say('Cut ' + n + (n === 1 ? ' item' : ' items') + '. Ctrl+V pastes at the mouse pointer.', 'ok');
    } else this.say('Copied ' + n + (n === 1 ? ' item' : ' items') + '. Ctrl+V pastes at the mouse pointer.', 'ok');
    this.changed(); return true;
  }
  // Paste centred on the point (or just right of the originals). Pasted areas are exact copies
  // (new IDs, same measurements) in their own drawing group, so they never clash with the originals.
  paste(at) {
    const C = this.clip;
    if (!C) { this.say('Nothing to paste yet: select something and press Ctrl+C first.'); this.changed(); return false; }
    if (this.mode !== 'select') return false;
    C.pastes++;
    const w = C.box.x2 - C.box.x1;
    const delta = at ? { x: at.x - C.box.c.x, y: at.y - C.box.c.y } : { x: (w + Math.max(5, w * 0.2)) * C.pastes, y: 0 };
    const before = this.snap(), idMap = {}, groupMap = {}, sel = [];
    for (const src of C.areas) {
      let g = groupMap[src.groupId];
      if (!g) { g = this.nid('g'); this.doc.groups.push({ id: g, name: 'Sketch ' + (this.doc.groups.length + 1) }); groupMap[src.groupId] = g; }
      const a = Model.clone(src), cmap = {};
      a.id = this.nid('a'); idMap[src.id] = a.id; a.groupId = g; a.locked = false; a.pendingDefine = false; a.name = this.suggestName(src.name);
      a.corners.forEach(c => { const n = this.nid('c'); cmap[c.id] = n; c.id = n; });
      a.walls.forEach(wl => { wl.id = this.nid('w'); wl.a = cmap[wl.a]; wl.b = cmap[wl.b]; });
      a.layoutOffset = { x: src.layoutOffset.x + delta.x, y: src.layoutOffset.y + delta.y };
      Model.syncClosed(a); this.doc.areas.push(a); sel.push({ t: 'area', id: a.id });
    }
    for (const src of C.labels) { const l = Model.clone(src); l.id = this.nid('t'); l.x += delta.x; l.y += delta.y; this.doc.labels.push(l); sel.push({ t: 'label', id: l.id }); }
    for (const src of C.syms) { const s = Model.clone(src); s.id = this.nid('s'); s.x += delta.x; s.y += delta.y; this.doc.symbols.push(s); sel.push({ t: 'symbol', id: s.id }); }
    for (const k of Object.keys(C.decisions)) { const [p, c] = k.split('>'); this.doc.decisions[idMap[p] + '>' + idMap[c]] = C.decisions[k]; }
    this.selection = sel;
    this.push('Paste', before);
    this.say('Pasted ' + sel.length + (sel.length === 1 ? ' item' : ' items') + ' (selected: drag or use the arrows to place them).', 'ok');
    if (C.areas.length) { this.afterGeometry(before.doc); this.amend(); }
    this.changed(); return true;
  }

  addSymbol(p, type, mods = {}) {
    const d = Model.SYMBOLS[type]; if (!d) return null;
    const before = this.snap(), s = { id: this.nid('s'), type, x: p.x, y: p.y, w: d.w, h: d.h, rot: 0, flip: false };
    if (d.snapToWall && !mods.shift) this.snapDoor(s, p);
    this.doc.symbols.push(s); this.selection = [{ t: 'symbol', id: s.id }];
    this.push('Add ' + d.name.toLowerCase(), before);
    this.say(d.name + ' placed. Drag to move it; R rotates it 90 degrees; size and angle are in Properties.', 'ok');
    this.changed(); return s;
  }
  setSymbol(id, f) {
    const s = this.doc.symbols.find(x => x.id === id); if (!s) return false;
    const def = Model.SYMBOLS[s.type] || {};
    return this.edit('Change symbol', () => {
      if (f.w > 0 && f.w <= 200) { s.w = f.w; if (def.square) s.h = f.w; }
      if (f.h > 0 && f.h <= 200 && !def.square) s.h = f.h;
      if (Number.isFinite(f.rot)) s.rot = ((f.rot % 360) + 360) % 360;
      if (typeof f.flip === 'boolean') s.flip = f.flip;
    });
  }
  addLabel(p, text, kind = 'text') {
    const t = String(text == null ? '' : text).replace(/\r/g, '').slice(0, Model.TEXT_MAX);
    if (!t.trim()) return null;
    const before = this.snap(), l = { id: this.nid('t'), text: t, x: p.x, y: p.y, size: null, kind };
    this.doc.labels.push(l); this.selection = [{ t: 'label', id: l.id }];
    this.push('Add ' + (kind === 'room' ? 'room label' : 'text'), before); this.changed();
    return l;
  }
  setLabelText(id, text) {
    const l = this.doc.labels.find(q => q.id === id), t = String(text).replace(/\r/g, '').slice(0, Model.TEXT_MAX);
    if (!l || !t.trim() || t === l.text) return false;
    return this.edit('Edit text', () => { l.text = t; });
  }
  setLabelSize(id, size) { const l = this.doc.labels.find(q => q.id === id); if (!l) return false; return this.edit('Text size', () => { l.size = Engine.textSizeValue(size); }); }
  // Replace the category list; reassign maps deleted category IDs to replacements (never orphans areas).
  setCategories(list, reassign = {}) {
    const ids = new Set(list.map(c => c.id));
    for (const a of this.doc.areas) if (!ids.has(a.categoryId) && !ids.has(reassign[a.categoryId])) {
      this.say('A category that is still in use needs a replacement before it can be deleted.', 'err'); return false;
    }
    return this.edit('Edit categories', () => {
      for (const a of this.doc.areas) if (!ids.has(a.categoryId)) a.categoryId = reassign[a.categoryId];
      this.doc.categories = list;
    }, true);
  }

  /* ---- Reposition measured area (changes measured relationships; not a page drag) ---- */
  describeAcctChange(before, after) {
    const lines = [];
    for (const a of this.doc.areas) {
      const b = before.areas[a.id], n = after.areas[a.id];
      if (!b || !n) continue;
      if (b.net !== n.net && b.net !== null && n.net !== null && Math.abs(b.net - n.net) > 1e-9) lines.push(a.name + ': ' + Geo.fmtSF(b.net) + ' → ' + Geo.fmtSF(n.net));
    }
    for (const p of before.pairs) if (!after.pairs.some(q => q.key === p.key)) lines.push(this.area(p.childId).name + ' would no longer be inside ' + this.area(p.parentId).name + '.');
    for (const p of after.pairs) if (!before.pairs.some(q => q.key === p.key)) lines.push(this.area(p.childId).name + ' would be inside ' + this.area(p.parentId).name + (p.decision === 'pending' ? ' (you will be asked about subtracting).' : '.'));
    if (Math.abs(before.living.value - after.living.value) > 1e-9) lines.push('Living Area Total: ' + Geo.fmtSF(before.living.value) + ' → ' + Geo.fmtSF(after.living.value));
    return lines;
  }
  previewReposition(id, dx, dy) {
    const tmp = Model.clone(Model.snapDoc(this.doc)); tmp.settings = this.doc.settings;
    const a = tmp.areas.find(x => x.id === id);
    for (const c of a.corners) { c.x += dx; c.y += dy; }
    return this.describeAcctChange(this.acct(), Model.account(tmp));
  }
  repositionArea(id, dx, dy) {
    const a = this.area(id);
    if (!a || !Number.isFinite(dx) || !Number.isFinite(dy) || (dx === 0 && dy === 0)) return false;
    if (a.locked) { this.sayLocked(a); this.changed(); return false; }
    if (Math.abs(dx) > 100000 || Math.abs(dy) > 100000 || !a.corners.every(c => Model.inRange({ x: c.x + dx, y: c.y + dy }))) {
      this.say('That move is too far. Reposition moves an area up to 100,000 ft at a time.', 'err'); this.changed(); return false;
    }
    const before = this.snap();
    for (const c of a.corners) { c.x += dx; c.y += dy; }
    for (const w of a.walls) if (w.dim.manual) { w.dim.x += dx; w.dim.y += dy; }
    for (const L of [a.nameLabel, a.sfLabel]) if (L.manual) { L.x += dx; L.y += dy; }
    this.push('Reposition measured area', before);
    this.say(a.name + ' moved ' + Geo.fmt1(dx) + ' ft right and ' + Geo.fmt1(dy) + ' ft down in measured position.', 'ok');
    this.afterGeometry(before.doc); this.amend(); this.changed();
    return true;
  }

  // Plain-words description of the selection and what Delete / Enter will do to it.
  selectionStatus() {
    const sel = this.selection;
    if (!sel.length) return null;
    if (sel.length > 1) return sel.length + ' items selected - drag or use the arrow keys to arrange; Delete removes them (dimensions and area labels are only hidden)';
    const r = sel[0], a = r.areaId ? this.area(r.areaId) : r.t === 'area' ? this.area(r.id) : null;
    const lock = a && a.locked ? ' (' + a.name + ' geometry is locked)' : '';
    switch (r.t) {
      case 'corner': {
        if (!a) return null;
        const n = Model.degree(a, r.id);
        if (a.locked) return 'Corner selected - ' + a.name + ' geometry is locked; unlock it in Properties to change walls';
        if (n > 2) return 'Corner selected - extra walls must be removed individually.';
        if (n <= 1) return 'Corner selected (open end) - Delete removes it and its wall; Enter draws from it.';
        return 'Corner selected - Delete will join its two adjacent walls.';
      }
      case 'wall': {
        const i = a ? a.walls.findIndex(w => w.id === r.id) : -1;
        if (i < 0) return null;
        const [p, q] = Model.wallEnds(a, i);
        return 'Wall selected (' + Geo.fmtLen(Geo.dist(p, q)) + ', ' + a.name + ')' + (lock || ' - Delete removes it; Enter edits its length.');
      }
      case 'dim': return 'Dimension selected - Delete hides it; drag or use the arrows to move it; H or V turns it.';
      case 'area': return a ? 'Area selected: ' + a.name + (lock || ' - drag or use the arrows to arrange it; Delete removes the whole area.') : null;
      case 'aname': return 'Area name label selected - drag to move it; Delete hides it; double-click to rename.';
      case 'asf': return 'Square footage label selected - drag to move it; Delete hides it (the number always comes from the walls).';
      case 'label': return 'Text selected - drag to move it; double-click to edit it; Delete removes it.';
      case 'symbol': return 'Symbol selected - drag to move it; round handle turns it, square handle resizes it; R = 90 degrees; flips in Properties; Delete removes it.';
    }
    return null;
  }

  /* ---- Status strip: what the program is waiting for ---- */
  statusText() {
    switch (this.mode) {
      case 'define': return 'Define Area: choose category, name and level, then press Enter';
      case 'penup': {
        const inp = this.pen.inp;
        if (inp.token !== null) return 'Start point: press an arrow to move it ' + inp.token + ' ft';
        if (this.pen.drawTool) return 'Draw: click a corner to keep drawing that area, or click anywhere to start a new one (Esc = Select)';
        return 'Place the starting point, then press Enter (type a distance + arrow to move it exactly)';
      }
      case 'drawing': {
        const a = this.activeArea(), inp = this.inp;
        if (inp.editing !== null) return 'Fixing a move: type the number, Enter to commit, or an arrow to change direction';
        if (inp.token !== null && inp.moves.length) return 'Press an arrow to give ' + inp.token + ' a direction (Backspace to fix)';
        if (inp.token !== null) return 'Press an arrow, or aim with the mouse and press Enter/click, to draw ' + inp.token + ' ft';
        if (inp.moves.length) return 'Press Enter to finish this wall (Backspace fixes, Esc clears)';
        return 'Drawing ' + a.name + ': type a distance and press an arrow (A closes)';
      }
      case 'dimstep': return 'Dimension: Enter to accept, Space to hide, arrows or drag to move, H/V to turn';
      case 'walledit': return 'Wall length: type the new length, Enter to confirm, Esc to cancel';
      case 'question': return 'Answer the subtraction question';
      case 'textedit': return 'Typing text: Enter to finish (Shift+Enter for a new line), Esc to cancel';
      case 'rotate': return 'Rotate: move the mouse around the selection (15 degree steps, Shift = any angle) or type an angle; Enter or click = done, Esc = cancel';
      default:
        if (this.armedSymbol) return 'Click on the sketch to place the ' + (Model.SYMBOLS[this.armedSymbol] || { name: 'symbol' }).name.toLowerCase() + ' symbol (Esc cancels)';
        if (this.armedLabel) return 'Click on the sketch to place "' + this.armedLabel + '" (Esc cancels)';
        if (this.tool === 'text') return 'Text tool: click where the text goes';
        return this.selectionStatus() || 'Select: click an item, drag to arrange, or press F4 (or N) to start a new area';
    }
  }
}

/* ============================================================================
   4. DRAWING (RENDERING)
   One scene builder (drawDoc) draws the sketch for both the screen and the
   exported image, so what you see is what you export. Text is placed in output
   pixels (never scaled glyphs) and always set as plain text, never as markup.
   Colors and lettering come from CONFIG (Part A); symbol drawings come from
   CONFIG.symbols.
   ============================================================================ */
const Render = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  const COL = Object.assign({ sketch: '#1F3864', roomLabels: '#000000', symbols: '#222222', background: '#ffffff',
    pen: '#16a34a', penUp: '#8a8f98', snap: '#e07b00', selection: '#7fb2f0', invalid: '#b91c1c' },
    (typeof CONFIG === 'object' && CONFIG && CONFIG.colors) || {});
  const FONT = (typeof CONFIG === 'object' && CONFIG && typeof CONFIG.font === 'string' && CONFIG.font.trim()) || 'Arial, Helvetica, sans-serif';
  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  const f2 = (v) => (Math.round(v * 100) / 100).toString();
  // Text centered on (x, y). Multi-line text uses tspans. Baseline set from the font size.
  function textEl(parent, str, x, y, px, attrs) {
    const t = el('text', Object.assign({ x: f2(x), y: f2(y), 'font-size': f2(px), 'font-family': FONT, 'text-anchor': 'middle' }, attrs || {}), parent);
    const lines = String(str).split('\n'), lh = px * 1.2, y0 = y - (lines.length - 1) * lh / 2 + px * 0.35;
    if (lines.length === 1) { t.setAttribute('y', f2(y0)); t.textContent = lines[0]; }
    else lines.forEach((ln, i) => { const s = el('tspan', { x: f2(x), y: f2(y0 + i * lh) }, t); s.textContent = ln.length ? ln : ' '; });
    return t;
  }
  const pathD = (P, closed) => 'M' + P.map(p => f2(p.x) + ',' + f2(p.y)).join('L') + (closed ? 'Z' : '');
  // Path for an area's walls: one closed shape when they form a loop, otherwise each wall.
  function areaPathD(a, T) {
    const pp = Model.poly(a);
    if (pp) return pathD(pp.map(p => T(Model.disp(a, p))), true);
    let d = '';
    for (let i = 0; i < a.walls.length; i++) {
      const [p, q] = Model.wallEnds(a, i).map(c => T(Model.disp(a, c)));
      d += 'M' + f2(p.x) + ',' + f2(p.y) + 'L' + f2(q.x) + ',' + f2(q.y);
    }
    return d;
  }
  // Size of the drawing area in screen pixels (works in every browser, with a fallback).
  function viewSize(svg) {
    let r = null;
    try { r = svg.getBoundingClientRect(); } catch (e) { r = null; }
    return { W: (r && r.width) || svg.clientWidth || 800, H: (r && r.height) || svg.clientHeight || 600 };
  }

  // ctx: { doc, acct, T(page point -> output px), s (px per ft), exporting, strokeW, override, showHiddenFor }
  function drawDoc(g, ctx) {
    const { doc, acct, T, s } = ctx, ts = doc.settings.textSize;
    for (const a of doc.areas) {
      const st = acct.areas[a.id];
      const geo = ctx.override && ctx.override.areaId === a.id ? ctx.override.area : a;
      const P = geo.corners.map(p => T(Model.disp(a, p)));
      if (!ctx.exporting && doc.settings.shading && st.status === 'closed')
        el('path', { d: areaPathD(geo, T), fill: COL.sketch, 'fill-opacity': 0.07, stroke: 'none' }, g);
      if (geo.walls.length) {
        const invalid = st.status === 'invalid' && !ctx.exporting;
        el('path', { d: areaPathD(geo, T), fill: 'none', stroke: invalid ? COL.invalid : COL.sketch, 'stroke-width': ctx.strokeW,
          'stroke-linejoin': 'miter', 'stroke-linecap': 'square', 'stroke-dasharray': invalid ? '7 4' : null }, g);
        if (!ctx.exporting && ctx.activeId !== a.id) for (const c of Model.openEnds(geo)) {
          const q = T(Model.disp(a, c));
          el('circle', { cx: f2(q.x), cy: f2(q.y), r: 5, fill: '#ffffff', stroke: COL.snap, 'stroke-width': 2 }, g);
        }
        if (!ctx.exporting) for (const i of st.bad || []) {
          if (!geo.walls[i]) continue;
          const [p, q] = Model.wallEnds(geo, i).map(c => T(Model.disp(a, c)));
          el('line', { x1: p.x, y1: p.y, x2: q.x, y2: q.y, stroke: '#ef4444', 'stroke-width': 7, 'stroke-opacity': 0.35 }, g);
        }
      } else if (P.length && !ctx.exporting) el('circle', { cx: P[0].x, cy: P[0].y, r: 3, fill: COL.sketch }, g);
      for (let i = 0; i < geo.walls.length; i++) {
        const w = geo.walls[i];
        if (w.dim.hidden && (ctx.exporting || !(ctx.showHiddenFor && ctx.showHiddenFor(a.id, w.id)))) continue;
        const [p0, p1] = Model.wallEnds(geo, i);
        const L = Geo.dist(p0, p1), c = T(Model.disp(a, Model.dimPos(geo, i, ts))), ang = Model.dimAngle(geo, i);
        textEl(g, Geo.fmtLen(L), c.x, c.y, ts * s, { fill: w.dim.hidden ? '#a8b0bc' : COL.sketch, transform: ang ? 'rotate(' + f2(ang) + ' ' + f2(c.x) + ' ' + f2(c.y) + ')' : null });
      }
      if (st.status === 'closed') {
        const lp = Model.areaLabelPos(doc, geo, acct);
        if (!a.nameLabel.hidden) { const c = T(Model.disp(a, lp.name)); textEl(g, a.name, c.x, c.y, lp.nameSize * s, { fill: COL.sketch }); }
        if (!a.sfLabel.hidden) { const c = T(Model.disp(a, lp.sf)); textEl(g, Model.sfText(acct, a.id), c.x, c.y, lp.sfSize * s, { fill: COL.sketch }); }
        if (!ctx.exporting && st.notes.length) {
          const c = T(Model.disp(a, lp.sf)), px = Math.max(10, lp.sfSize * s * 0.62);
          st.notes.slice(0, 3).forEach((n, k) => textEl(g, n.text, c.x, c.y + lp.sfSize * s * 0.9 + px * 1.25 * (k + 0.5), px,
            { fill: n.kind === 'conflict' || n.kind === 'partial' || n.kind === 'dup' ? '#b91c1c' : '#a15c07', 'font-style': 'italic' }));
        }
      } else if (!ctx.exporting && P.length) {
        const tag = st.status === 'open' ? a.name + ': ' + st.reason : a.name + ': INVALID, not counted. ' + st.reason;
        const px = Math.max(11, ts * s * 0.7);
        const topY = Math.min(...P.map(q => q.y)) - ts * s * 1.8 - px, leftX = Math.min(...P.map(q => q.x));
        textEl(g, tag, leftX, topY, px, { fill: st.status === 'open' ? '#6b7280' : '#b91c1c', 'font-style': 'italic', 'text-anchor': 'start' });
      }
    }
    for (const l of doc.labels) { const c = T(l); textEl(g, l.text, c.x, c.y, (l.size || ts) * s, { fill: COL.roomLabels }); }
    const symPx = ctx.exporting ? f2(Math.max(1, ts * 0.09 * s)) : 1.3;
    for (const sy of doc.symbols || []) drawSymbol(g, sy, T, s, symPx);
  }

  // Symbols: each one is drawn by its own draw() in CONFIG.symbols, in the symbol's own
  // feet around its center, then rotated, optionally mirrored, and scaled to the output.
  // Lines keep a set width at any size. The "kit" is the set of drawing helpers.
  const f4 = (v) => (Math.round(v * 1e4) / 1e4).toString();
  function symbolKit(grp, strokePx) {
    const P = (x, y) => f4(x) + ',' + f4(y);
    return {
      tread: 0.85,
      stroke: (d) => el('path', { d, fill: 'none', stroke: COL.symbols, 'stroke-width': strokePx, 'vector-effect': 'non-scaling-stroke', 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, grp),
      line: (x1, y1, x2, y2) => 'M' + P(x1, y1) + 'L' + P(x2, y2),
      box: (x1, y1, x2, y2) => 'M' + P(x1, y1) + 'L' + P(x2, y1) + 'L' + P(x2, y2) + 'L' + P(x1, y2) + 'Z',
      poly: (pts, closed) => 'M' + pts.map(([x, y]) => P(x, y)).join('L') + (closed ? 'Z' : ''),
      arc: (x1, y1, x2, y2, r) => 'M' + P(x1, y1) + 'A' + f4(r) + ',' + f4(r) + ' 0 0 1 ' + P(x2, y2),
      circle: (x, y, r) => 'M' + P(x - r, y) + 'A' + f4(r) + ',' + f4(r) + ' 0 1 0 ' + P(x + r, y) + 'A' + f4(r) + ',' + f4(r) + ' 0 1 0 ' + P(x - r, y),
      arrowHead: (tx, ty, dx, dy, k) => 'M' + P(tx - dx * k - dy * k * 0.6, ty - dy * k + dx * k * 0.6) + 'L' + P(tx, ty) + 'L' + P(tx - dx * k + dy * k * 0.6, ty - dy * k - dx * k * 0.6),
    };
  }
  function drawSymbol(g, sym, T, s, strokePx) {
    const c = T(sym), w = sym.w, h = sym.h, def = Model.SYMBOLS[sym.type];
    const grp = el('g', { transform: 'translate(' + f2(c.x) + ' ' + f2(c.y) + ') rotate(' + f2(sym.rot || 0) + ') scale(' + f4(s * (sym.flip ? -1 : 1)) + ' ' + f4(s) + ')' }, g);
    const kit = symbolKit(grp, strokePx);
    // A symbol whose drawing has a mistake in it (or is unknown) is shown as a plain box.
    try { if (def) def.draw(kit, w, h); else kit.stroke(kit.box(-w / 2, -h / 2, w / 2, h / 2)); }
    catch (e) { while (grp.firstChild) grp.removeChild(grp.firstChild); kit.stroke(kit.box(-w / 2, -h / 2, w / 2, h / 2)); }
  }

  function drawGrid(svg, view, W, H) {
    const steps = [1, 5, 10, 50, 100, 500];
    const step = steps.find(v => v * view.s >= 14) || 1000;
    const g = el('g', { stroke: '#edf0f4', 'stroke-width': 1 }, svg);
    for (let x = Math.floor(view.ox / step) * step; (x - view.ox) * view.s <= W; x += step) { const X = (x - view.ox) * view.s; el('line', { x1: X, y1: 0, x2: X, y2: H }, g); }
    for (let y = Math.floor(view.oy / step) * step; (y - view.oy) * view.s <= H; y += step) { const Y = (y - view.oy) * view.s; el('line', { x1: 0, y1: Y, x2: W, y2: Y }, g); }
  }
  function crosshair(g, p, color) {
    const r = 16;
    el('line', { x1: p.x - r, y1: p.y, x2: p.x + r, y2: p.y, stroke: color, 'stroke-width': 1.3 }, g);
    el('line', { x1: p.x, y1: p.y - r, x2: p.x, y2: p.y + r, stroke: color, 'stroke-width': 1.3 }, g);
    el('circle', { cx: p.x, cy: p.y, r: 3.5, fill: 'none', stroke: color, 'stroke-width': 1.3 }, g);
  }
  function snapMark(g, p, kind) {
    if (kind === 'corner') el('circle', { cx: p.x, cy: p.y, r: 6.5, fill: 'none', stroke: COL.snap, 'stroke-width': 2 }, g);
    else if (kind === 'wall') el('rect', { x: p.x - 4.5, y: p.y - 4.5, width: 9, height: 9, fill: 'none', stroke: COL.snap, 'stroke-width': 2, transform: 'rotate(45 ' + p.x + ' ' + p.y + ')' }, g);
  }
  function textBoxPx(g, c, text, px, ang, color) {
    const b = Engine.textBox(text, px);
    el('rect', { x: c.x - b.w / 2 - 3, y: c.y - b.h / 2 - 2, width: b.w + 6, height: b.h + 4, fill: color, 'fill-opacity': 0.25, stroke: color, 'stroke-width': 1,
      transform: ang ? 'rotate(' + ang + ' ' + c.x + ' ' + c.y + ')' : null }, g);
  }

  // Full screen render. ui carries the view, cached accounting and interaction overlays.
  function renderScreen(svg, eng, ui) {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    const doc = eng.doc, acct = ui.acct, view = ui.view, s = view.s, ts = doc.settings.textSize;
    const T = (p) => ({ x: (p.x - view.ox) * s, y: (p.y - view.oy) * s });
    const { W, H } = viewSize(svg);
    el('rect', { x: 0, y: 0, width: W, height: H, fill: COL.background }, svg);
    if (doc.settings.grid) drawGrid(svg, view, W, H);
    const selG = el('g', {}, svg), docG = el('g', {}, svg), ovG = el('g', {}, svg);
    const selArea = new Set();
    for (const r of eng.selection) {
      const a = eng.area(r.t === 'area' ? r.id : r.areaId);
      if (r.t === 'label') {
        const l = doc.labels.find(q => q.id === r.id); if (l) textBoxPx(selG, T(l), l.text, (l.size || ts) * s, 0, COL.selection);
      } else if (r.t === 'symbol') {
        const sy = doc.symbols.find(q => q.id === r.id);
        if (sy) el('path', { d: pathD(Model.symbolCorners(sy).map(T), true), fill: COL.selection, 'fill-opacity': 0.18, stroke: '#2563eb', 'stroke-width': 1.5, 'stroke-dasharray': '5 3' }, selG);
      } else if (!a) continue;
      else if (r.t === 'area') {
        selArea.add(a.id);
        const P = a.corners.map(p => T(Model.disp(a, p)));
        if (a.walls.length) el('path', { d: areaPathD(a, T), fill: a.closed ? COL.selection : 'none', 'fill-opacity': 0.12, stroke: COL.selection, 'stroke-width': 7, 'stroke-linejoin': 'round' }, selG);
        for (const q of P) el('rect', { x: q.x - 2.5, y: q.y - 2.5, width: 5, height: 5, fill: '#ffffff', stroke: COL.sketch, 'stroke-width': 1 }, ovG);
      } else if (r.t === 'corner') {
        const c = a.corners.find(q => q.id === r.id); if (!c) continue;
        const q = T(Model.disp(a, c));
        // A selected corner is unmistakable: a bold ring drawn above the walls.
        el('circle', { cx: q.x, cy: q.y, r: 11, fill: '#2563eb', 'fill-opacity': 0.18, stroke: '#1d4ed8', 'stroke-width': 2.5 }, ovG);
        el('circle', { cx: q.x, cy: q.y, r: 3.5, fill: '#ffffff', stroke: '#1d4ed8', 'stroke-width': 2 }, ovG);
        selArea.add(a.id);
      } else if (r.t === 'wall') {
        const i = a.walls.findIndex(w => w.id === r.id); if (i < 0) continue;
        const [p, q] = Model.wallEnds(a, i).map(c => T(Model.disp(a, c)));
        el('line', { x1: p.x, y1: p.y, x2: q.x, y2: q.y, stroke: COL.selection, 'stroke-width': 9, 'stroke-linecap': 'butt' }, selG);
        for (const e of [p, q]) el('rect', { x: e.x - 3, y: e.y - 3, width: 6, height: 6, fill: '#ffffff', stroke: '#1d4ed8', 'stroke-width': 1.5 }, ovG);
        selArea.add(a.id);
      } else if (r.t === 'dim') {
        const i = a.walls.findIndex(w => w.id === r.id); if (i < 0) continue;
        const [p, q] = Model.wallEnds(a, i);
        textBoxPx(selG, T(Model.disp(a, Model.dimPos(a, i, ts))), Geo.fmtLen(Geo.dist(p, q)), ts * s, Model.dimAngle(a, i), COL.selection);
        selArea.add(a.id);
      } else if ((r.t === 'aname' || r.t === 'asf') && acct.areas[a.id].status === 'closed') {
        const lp = Model.areaLabelPos(doc, a, acct);
        if (r.t === 'aname') textBoxPx(selG, T(Model.disp(a, lp.name)), a.name, lp.nameSize * s, 0, COL.selection);
        else textBoxPx(selG, T(Model.disp(a, lp.sf)), Model.sfText(acct, a.id), lp.sfSize * s, 0, COL.selection);
      }
    }
    const w = eng.wedit;
    const override = w && w.cand ? { areaId: w.areaId, area: w.cand.area } : null;
    drawDoc(docG, { doc, acct: w && ui.weditAcct ? ui.weditAcct : acct, T, s, exporting: false, strokeW: 2, override,
      activeId: eng.mode === 'drawing' || eng.mode === 'dimstep' ? eng.activeAreaId : null,
      showHiddenFor: (aid) => selArea.has(aid) });
    if (w) {
      const a = eng.area(w.areaId);
      el('path', { d: areaPathD(a, T), fill: 'none', stroke: COL.penUp, 'stroke-width': 1, 'stroke-dasharray': '4 3' }, ovG);
      if (w.cand) {
        const ca = w.cand.area;
        el('path', { d: areaPathD(ca, T), fill: 'none', stroke: w.error ? '#dc2626' : COL.pen, 'stroke-width': 2.5, 'stroke-opacity': 0.8 }, ovG);
        for (const i of w.bad) {
          if (!ca.walls[i]) continue;
          const [p, q] = Model.wallEnds(ca, i).map(c => T(Model.disp(a, c)));
          el('line', { x1: p.x, y1: p.y, x2: q.x, y2: q.y, stroke: '#ef4444', 'stroke-width': 8, 'stroke-opacity': 0.4 }, ovG);
        }
      }
    }
    // Drawing overlays: pending wall, closure target, snap markers, guides, crosshair.
    if (eng.mode === 'drawing' || eng.mode === 'dimstep') {
      const a = eng.activeArea();
      if (a && eng.anchor()) {
        const anchorS = T(Model.disp(a, eng.anchor())), target = eng.mode === 'drawing' ? eng.closureTarget() : null;
        if (target) {
          const c0 = T(Model.disp(a, target));
          const pend = eng.pending();
          const hot = pend && (pend.kind === 'close' || Geo.same(pend.pt, target, Geo.EPS));
          el('circle', { cx: c0.x, cy: c0.y, r: hot ? 11 : 6, fill: hot ? 'rgba(22,163,74,.15)' : 'none', stroke: COL.pen, 'stroke-width': hot ? 2.5 : 1.5 }, ovG);
        }
        el('circle', { cx: anchorS.x, cy: anchorS.y, r: 3.5, fill: COL.pen }, ovG);
        if (eng.mode === 'drawing') {
          const pend = eng.pending();
          const endS = T(Model.disp(a, pend.pt));
          for (const gd of eng.guides(pend.pt)) {
            const f = T(Model.disp(a, gd.from));
            el('line', { x1: f.x, y1: f.y, x2: endS.x, y2: endS.y, stroke: pend.kind === 'align' ? COL.snap : '#7d8aa0', 'stroke-width': 1.2, 'stroke-dasharray': '5 4' }, ovG);
          }
          if (pend.kind === 'align') el('rect', { x: endS.x - 4, y: endS.y - 4, width: 8, height: 8, fill: 'none', stroke: COL.snap, 'stroke-width': 2 }, ovG);
          if (Geo.dist(pend.pt, eng.anchor()) > Geo.LEN_EPS)
            el('line', { x1: anchorS.x, y1: anchorS.y, x2: endS.x, y2: endS.y, stroke: COL.pen, 'stroke-width': 2, 'stroke-dasharray': pend.src === 'keys' ? null : '7 4' }, ovG);
          if (pend.exact && pend.kind !== 'close') snapMark(ovG, endS, pend.kind);
          if (pend.axis) textEl(ovG, pend.axis === 'h' ? '↔' : '↕', endS.x + 14, endS.y - 14, 14, { fill: COL.snap, 'font-weight': 'bold' });
          crosshair(ovG, pend.src === 'none' && eng.mouse ? T(eng.mouse) : endS, COL.pen);
        }
        if (eng.mode === 'dimstep' && eng.dim) {
          const { a: da, i } = eng.dimWall(), [p, q] = Model.wallEnds(da, i);
          textBoxPx(ovG, T(Model.disp(da, Model.dimPos(da, i, ts))), Geo.fmtLen(Geo.dist(p, q)), ts * s, Model.dimAngle(da, i), '#f59e0b');
        }
      }
    }
    if (eng.mode === 'penup' && eng.pen) {
      const r = eng.penRes(), c = T(Model.disp({ layoutOffset: r.offset }, r.pt));
      if (r.snap) snapMark(ovG, c, r.snap.kind);
      if (r.snap && r.snap.kind === 'align') for (const gc of r.snap.guides) {
        const f = T(Model.disp({ layoutOffset: r.offset }, gc));
        el('line', { x1: f.x, y1: f.y, x2: c.x, y2: c.y, stroke: COL.snap, 'stroke-width': 1.2, 'stroke-dasharray': '5 4' }, ovG);
      }
      crosshair(ovG, c, COL.penUp);
    }
    const hs = eng.mode === 'select' ? eng.symHandles() : null;      // one selected symbol: rotate and size handles
    if (hs) {
      const top = T(hs.top), rh = T(hs.rotate), sh = T(hs.size);
      el('line', { x1: top.x, y1: top.y, x2: rh.x, y2: rh.y, stroke: '#2563eb', 'stroke-width': 1.2 }, ovG);
      el('circle', { cx: rh.x, cy: rh.y, r: 6, fill: '#ffffff', stroke: '#2563eb', 'stroke-width': 1.6 }, ovG);
      el('rect', { x: sh.x - 5, y: sh.y - 5, width: 10, height: 10, fill: '#ffffff', stroke: '#2563eb', 'stroke-width': 1.6 }, ovG);
    }
    if (eng.mode === 'rotate' && eng.rot) {
      const c = T(eng.rot.c);
      el('circle', { cx: c.x, cy: c.y, r: 4, fill: COL.snap }, ovG);
      if (eng.mouse) { const m = T(eng.mouse); el('line', { x1: c.x, y1: c.y, x2: m.x, y2: m.y, stroke: COL.snap, 'stroke-width': 1.2, 'stroke-dasharray': '5 4' }, ovG); }
    }
    if (ui.box) {
      const a = T({ x: ui.box.x1, y: ui.box.y1 }), b = T({ x: ui.box.x2, y: ui.box.y2 });
      el('rect', { x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), width: Math.abs(a.x - b.x), height: Math.abs(a.y - b.y),
        fill: 'rgba(59,130,246,.08)', stroke: '#3b82f6', 'stroke-width': 1, 'stroke-dasharray': '4 3' }, ovG);
    }
  }

  // Bounds of everything visible in the export (walls and full text boxes, rotation included).
  function contentBounds(doc, acct, measure, opts = {}) {
    const ts = doc.settings.textSize, b = { x1: Infinity, y1: Infinity, x2: -Infinity, y2: -Infinity };
    const addP = (p) => { b.x1 = Math.min(b.x1, p.x); b.y1 = Math.min(b.y1, p.y); b.x2 = Math.max(b.x2, p.x); b.y2 = Math.max(b.y2, p.y); };
    const addText = (c, text, size, ang) => {
      const m = measure(text, size), r = (ang || 0) * Math.PI / 180, co = Math.cos(r), si = Math.sin(r);
      for (const [dx, dy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
        const x = dx * m.w / 2, y = dy * m.h / 2;
        addP({ x: c.x + x * co - y * si, y: c.y + x * si + y * co });
      }
    };
    for (const a of doc.areas) {
      for (const c of a.corners) addP(Model.disp(a, c));
      for (let i = 0; i < a.walls.length; i++) {
        if (a.walls[i].dim.hidden && !opts.includeHidden) continue;
        const [p, q] = Model.wallEnds(a, i);
        addText(Model.disp(a, Model.dimPos(a, i, ts)), Geo.fmtLen(Geo.dist(p, q)), ts, Model.dimAngle(a, i));
      }
      if (acct.areas[a.id].status === 'closed') {
        const lp = Model.areaLabelPos(doc, a, acct);
        if (!a.nameLabel.hidden) addText(Model.disp(a, lp.name), a.name, lp.nameSize, 0);
        if (!a.sfLabel.hidden) addText(Model.disp(a, lp.sf), Model.sfText(acct, a.id), lp.sfSize, 0);
      }
    }
    for (const l of doc.labels) addText(l, l.text, l.size || ts, 0);
    for (const sy of doc.symbols || []) for (const p of Model.symbolCorners(sy)) addP(p);
    return Number.isFinite(b.x1) ? b : null;
  }
  // Clean export picture built from the sketch data (no grid, shading, preview or selection).
  function buildExport(doc, acct, longSide, measure) {
    const b = contentBounds(doc, acct, measure); if (!b) return null;
